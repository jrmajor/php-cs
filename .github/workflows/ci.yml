name: CI

on: push

env:
  PHP_LOWEST: '8.3'
  PHP_LATEST: '8.5'

jobs:
  tests:
    name: Tests / ${{ matrix.php }} PHP, ${{ matrix.dependencies }} deps

    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [lowest, latest]
        dependencies: [lowest, highest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php == 'lowest' && env.PHP_LOWEST || env.PHP_LATEST }}
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Execute tests
        run: vendor/bin/phpunit

  types:
    name: Types / ${{ matrix.php }} PHP

    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: lowest
            dependencies: lowest
          - php: latest
            dependencies: highest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php == 'lowest' && env.PHP_LOWEST || env.PHP_LATEST }}
          coverage: none

      - name: PHPStan cache
        uses: actions/cache@v6
        with:
          path: .cache/phpstan
          key: phpstan-${{ github.sha }}
          restore-keys: phpstan-

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run PHPStan
        run: vendor/bin/phpstan analyze --no-progress --no-interaction

  style:
    name: Style

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_LOWEST }}
          coverage: none

      - name: PHP-CS-Fixer cache
        uses: actions/cache@v6
        with:
          path: .cache/.php-cs-fixer.cache
          key: php-cs-fixer-${{ github.sha }}
          restore-keys: php-cs-fixer-

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction

  integration:
    name: Integration / ${{ matrix.project }}

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - arbor
          - bajki-muza
          - fluent-php
          - laravel-fluent
          - pluralrules

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: php-cs

      - name: Checkout the other repo
        uses: actions/checkout@v7
        with:
          repository: jrmajor/${{ matrix.project }}
          path: integration

      - name: Get PHP version
        id: php-version
        run: echo "version=$(jq -r .require.php integration/composer.json | grep -oE '[0-9]+\.[0-9]+' | head -1)" >> $GITHUB_OUTPUT

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php-version.outputs.version }}
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.COMPOSER_GITHUB_TOKEN }}

      - name: Get Composer cache directory path
        id: composer-cache
        working-directory: integration
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.project }}-${{ hashFiles('integration/composer.lock') }}
          restore-keys: |
            composer-${{ matrix.project }}-
            composer-

      - name: Run Composer diagnostics
        continue-on-error: true
        working-directory: integration
        run: composer diagnose

      - name: Install Composer dependencies
        working-directory: integration
        run: |
          composer config minimum-stability dev
          composer config repositories.php-cs path ../php-cs
          composer require --dev jrmajor/cs:* --with-all-dependencies --no-scripts

      - name: Run PHP-CS-Fixer
        continue-on-error: true
        working-directory: integration
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction
